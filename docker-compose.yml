services:

  postgres:
    image: postgres:16-alpine
    container_name: cloud-cost-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cloud_cost_detective

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - cloud-cost-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloud_cost_detective"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: cloud-cost-backend

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cloud_cost_detective

      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}

      JWT_SECRET: ${JWT_SECRET:-change-this-secret}

    ports:
      - "8081:8000"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - cloud-cost-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: cloud-cost-frontend

    ports:
      - "80:80"

    depends_on:
      - backend

    networks:
      - cloud-cost-network


volumes:
  postgres_data:


networks:
  cloud-cost-network:
    driver: bridge
